<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kitsch</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				font-family: Helvetica, Arial, sans-serif;
			}
			.stage {
				width: 100%;
				height: 100%;
				display: grid;
				place-items: center;
				background: conic-gradient(from var(--a, 0deg), #ff4ecd, #ffe14a, #3dffb5, #4aa3ff, #ff4ecd);
				transition: filter 0.2s ease;
			}
			.card {
				width: min(70vw, 22rem);
				aspect-ratio: 1;
				border-radius: 50% 40% 55% 45%;
				background: #111;
				color: #fff;
				display: grid;
				place-items: center;
				text-align: center;
				padding: 2rem;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
				transform: rotate(var(--r, -6deg)) scale(var(--s, 1));
				transition: transform 0.15s ease;
			}
			h1 {
				margin: 0;
				font-size: clamp(2rem, 8vw, 3.5rem);
				letter-spacing: -0.04em;
			}
			p {
				margin: 0.75rem 0 0;
				opacity: 0.8;
			}
		</style>
	</head>
	<body>
		<div class="stage" id="stage">
			<div class="card" id="card">
				<div>
					<h1>KITSCH</h1>
					<p>Move your pointer</p>
				</div>
			</div>
		</div>
		<script>
			const stage = document.getElementById('stage');
			const card = document.getElementById('card');
			window.addEventListener('pointermove', (e) => {
				const x = e.clientX / window.innerWidth;
				const y = e.clientY / window.innerHeight;
				stage.style.setProperty('--a', `${x * 360}deg`);
				card.style.setProperty('--r', `${(x - 0.5) * 24}deg`);
				card.style.setProperty('--s', `${0.92 + y * 0.2}`);
			});
		</script>
	</body>
</html>
