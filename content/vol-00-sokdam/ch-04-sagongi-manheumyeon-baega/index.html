<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>사공이 많으면 배가 산으로 올라간다</title>
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #1b2240;
				touch-action: none;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			.caption {
				position: fixed;
				left: 8%;
				right: 8%;
				top: 38%;
				margin: 0;
				color: #1a1208;
				font: 700 28px/1.25 "Comic Sans MS", "Apple SD Gothic Neo", cursive;
				transform: rotate(-4deg);
				text-align: center;
				opacity: 0;
				transition: opacity 0.35s ease;
				pointer-events: none;
				text-shadow: 2px 2px 0 #fff6d8;
			}
			.caption.is-on {
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<p class="caption" id="caption">사공이 많으면 배가 산으로 올라간다</p>
		<script>
			const canvas = document.getElementById("c");
			const ctx = canvas.getContext("2d");
			const caption = document.getElementById("caption");
			const TAU = Math.PI * 2;
			const LINES = ["내가!", "내가 저을게!", "조금만!", "이쪽으로!", "아니 반대로!"];
			const COLORS = ["#e85d4c", "#f2b134", "#3cb371", "#4c8dde", "#c45ed4", "#ff7a59"];

			let w = 0;
			let h = 0;
			let dpr = 1;
			let time = 0;
			let last = performance.now();

			const boat = { x: 0, y: 0, a: 0 };
			const sailors = [];
			const bubbles = [];
			const smears = [];
			let peaked = false;

			function resize() {
				dpr = Math.min(window.devicePixelRatio || 1, 2);
				w = window.innerWidth;
				h = window.innerHeight;
				canvas.width = Math.floor(w * dpr);
				canvas.height = Math.floor(h * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				if (!sailors.length) resetCrew();
			}

			function waterY(x) {
				return h * 0.64 + Math.sin(x * 0.01 + time * 1.6) * 6;
			}

			function mountainY(x) {
				const t = Math.max(0, (x - w * 0.48) / (w * 0.52));
				if (t <= 0) return h + 40;
				const peak = h * 0.22;
				const base = h * 0.78;
				return base - Math.pow(t, 0.72) * (base - peak) + Math.sin(t * 9) * 10;
			}

			function resetCrew() {
				sailors.length = 0;
				bubbles.length = 0;
				smears.length = 0;
				peaked = false;
				caption.classList.remove("is-on");
				boat.x = w * 0.2;
				boat.y = waterY(boat.x) - 8;
				boat.a = 0;
				addSailor(true);
			}

			function addSailor(silent) {
				if (peaked) {
					resetCrew();
					return;
				}
				const i = sailors.length;
				const sign = i % 2 === 0 ? 1 : -1;
				const angle = i === 0 ? 0 : sign * (18 + i * 11) * (Math.PI / 180);
				sailors.push({
					angle,
					color: COLORS[i % COLORS.length],
					bob: Math.random() * TAU,
				});
				if (!silent) {
					bubbles.push({
						text: LINES[i % LINES.length],
						x: boat.x + (Math.random() - 0.5) * 50,
						y: boat.y - 36,
						life: 1,
					});
				}
			}

			function drawSky() {
				const g = ctx.createLinearGradient(0, 0, 0, h);
				g.addColorStop(0, "#1b2240");
				g.addColorStop(0.28, "#f2b36b");
				g.addColorStop(0.5, "#87c6e8");
				g.addColorStop(1, "#5aa0d4");
				ctx.fillStyle = g;
				ctx.fillRect(0, 0, w, h);
				ctx.fillStyle = "#fff3c4";
				ctx.beginPath();
				ctx.arc(w * 0.18, h * 0.22, 28, 0, TAU);
				ctx.fill();
			}

			function drawMountain() {
				ctx.beginPath();
				ctx.moveTo(w * 0.46, h);
				for (let x = w * 0.46; x <= w; x += 8) {
					ctx.lineTo(x, mountainY(x));
				}
				ctx.lineTo(w, h);
				ctx.closePath();
				ctx.fillStyle = "#3d8b4a";
				ctx.fill();
				ctx.fillStyle = "#2f6b38";
				ctx.beginPath();
				ctx.moveTo(w * 0.62, h);
				for (let x = w * 0.62; x <= w; x += 10) ctx.lineTo(x, mountainY(x) + 28);
				ctx.lineTo(w, h);
				ctx.fill();

				ctx.fillStyle = "#f7f2e4";
				ctx.beginPath();
				ctx.moveTo(w * 0.78, mountainY(w * 0.78));
				ctx.lineTo(w * 0.9, mountainY(w * 0.9) + 8);
				ctx.lineTo(w * 0.86, mountainY(w * 0.86) + 36);
				ctx.fill();

				ctx.fillStyle = "#24532c";
				for (let i = 0; i < 9; i += 1) {
					const x = w * 0.55 + i * w * 0.05;
					const y = mountainY(x) + 8;
					ctx.beginPath();
					ctx.moveTo(x, y - 28);
					ctx.lineTo(x - 10, y);
					ctx.lineTo(x + 10, y);
					ctx.fill();
				}
			}

			function drawWater() {
				ctx.fillStyle = "#3d8fe0";
				ctx.beginPath();
				ctx.moveTo(0, h);
				for (let x = 0; x <= w * 0.62; x += 10) ctx.lineTo(x, waterY(x));
				ctx.lineTo(w * 0.62, h);
				ctx.closePath();
				ctx.fill();
				ctx.strokeStyle = "rgba(255,255,255,0.35)";
				ctx.lineWidth = 2;
				for (let i = 0; i < 5; i += 1) {
					ctx.beginPath();
					const y = h * 0.7 + i * 16;
					for (let x = 0; x < w * 0.58; x += 16) {
						ctx.lineTo(x, y + Math.sin(x * 0.08 + time * 3 + i) * 3);
					}
					ctx.stroke();
				}
			}

			function drawSmears() {
				for (const smear of smears) {
					ctx.fillStyle = "rgba(61, 143, 224, 0.28)";
					ctx.beginPath();
					ctx.ellipse(smear.x, smear.y, 16, 7, smear.a, 0, TAU);
					ctx.fill();
				}
			}

			function drawBoat() {
				ctx.save();
				ctx.translate(boat.x, boat.y);
				ctx.rotate(boat.a);
				ctx.fillStyle = "#e67a2e";
				ctx.beginPath();
				ctx.moveTo(-34, 0);
				ctx.quadraticCurveTo(0, 22, 36, 0);
				ctx.quadraticCurveTo(0, 8, -34, 0);
				ctx.fill();
				ctx.strokeStyle = "#7a3a10";
				ctx.lineWidth = 2;
				ctx.stroke();
				ctx.fillStyle = "#f3d27a";
				ctx.fillRect(-2, -28, 4, 28);

				sailors.forEach((sailor, i) => {
					const px = -18 + (i % 5) * 9;
					const py = -8 - Math.floor(i / 5) * 10 + Math.sin(time * 6 + sailor.bob) * 1.5;
					ctx.fillStyle = sailor.color;
					ctx.beginPath();
					ctx.arc(px, py - 8, 5.2, 0, TAU);
					ctx.fill();
					ctx.fillRect(px - 3.5, py - 4, 7, 9);
					const oar = time * 8 + sailor.angle * 8;
					ctx.strokeStyle = "#5a3a1a";
					ctx.lineWidth = 2;
					ctx.beginPath();
					ctx.moveTo(px, py);
					ctx.lineTo(px + Math.cos(sailor.angle + oar) * 22, py + Math.sin(sailor.angle + oar) * 10);
					ctx.stroke();
				});
				ctx.restore();
			}

			function drawBubbles() {
				for (const bubble of bubbles) {
					ctx.save();
					ctx.globalAlpha = bubble.life;
					ctx.translate(bubble.x, bubble.y);
					ctx.rotate(-0.08);
					ctx.fillStyle = "#fff8dc";
					ctx.strokeStyle = "#1a1208";
					ctx.lineWidth = 2;
					const tw = 72;
				ctx.beginPath();
				ctx.moveTo(-tw / 2 + 8, -16);
				ctx.lineTo(tw / 2 - 8, -16);
				ctx.quadraticCurveTo(tw / 2, -16, tw / 2, -8);
				ctx.lineTo(tw / 2, 0);
				ctx.quadraticCurveTo(tw / 2, 8, tw / 2 - 8, 8);
				ctx.lineTo(-tw / 2 + 8, 8);
				ctx.quadraticCurveTo(-tw / 2, 8, -tw / 2, 0);
				ctx.lineTo(-tw / 2, -8);
				ctx.quadraticCurveTo(-tw / 2, -16, -tw / 2 + 8, -16);
				ctx.closePath();
				ctx.fill();
				ctx.stroke();
					ctx.fillStyle = "#1a1208";
					ctx.font = "700 12px 'Apple SD Gothic Neo', sans-serif";
					ctx.textAlign = "center";
					ctx.fillText(bubble.text, 0, 1);
					ctx.restore();
				}
			}

			function step(dt) {
				time += dt;
				let vx = 0;
				let vy = 0;
				for (const sailor of sailors) {
					vx += Math.cos(sailor.angle) * 42;
					vy += Math.sin(sailor.angle) * 42;
				}
				if (sailors.length >= 5 && boat.x > w * 0.4) {
					vy -= (sailors.length - 4) * 22;
					vx += 10;
				}
				boat.x += vx * dt * 0.28;
				boat.a = Math.atan2(vy, Math.max(20, vx)) * 0.2;
				boat.x = Math.max(30, Math.min(w - 20, boat.x));

				if (boat.x < w * 0.5 || sailors.length < 5) {
					boat.y += (waterY(boat.x) - 8 - boat.y) * 0.2;
				} else {
					const slope = mountainY(boat.x) - 10;
					boat.y += (slope - boat.y) * Math.min(0.2, 0.035 * sailors.length);
					smears.push({ x: boat.x, y: boat.y + 10, a: boat.a });
					if (smears.length > 90) smears.shift();
				}

				if (!peaked && sailors.length >= 6 && boat.x > w * 0.76 && boat.y < h * 0.4) {
					peaked = true;
					caption.classList.add("is-on");
				}

				for (let i = bubbles.length - 1; i >= 0; i -= 1) {
					bubbles[i].y -= 18 * dt;
					bubbles[i].life -= dt * 0.9;
					if (bubbles[i].life <= 0) bubbles.splice(i, 1);
				}
			}

			function frame(now) {
				const dt = Math.min(0.033, (now - last) / 1000);
				last = now;
				step(dt);
				drawSky();
				drawMountain();
				drawSmears();
				drawWater();
				drawBoat();
				drawBubbles();
				requestAnimationFrame(frame);
			}

			canvas.addEventListener("pointerdown", () => addSailor(false));
			window.addEventListener("keydown", (event) => {
				if (event.code === "Space" || event.key === "Enter") {
					event.preventDefault();
					addSailor(false);
				}
			});
			window.addEventListener("resize", () => {
				const had = sailors.length;
				resize();
				if (had && sailors.length === 1 && had > 1) {
					for (let i = 1; i < had; i += 1) addSailor(true);
				}
			});

			resize();
			requestAnimationFrame(frame);
		</script>
	</body>
</html>
