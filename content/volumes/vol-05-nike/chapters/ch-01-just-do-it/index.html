<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Just Do It</title>
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #1a5cff;
				cursor: crosshair;
				font-family: Arial Black, Helvetica, sans-serif;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			.hint {
				position: fixed;
				left: 1rem;
				bottom: 1rem;
				color: rgba(255, 255, 255, 0.7);
				font-family: Helvetica, Arial, sans-serif;
				font-size: 0.8rem;
				letter-spacing: 0.04em;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<div class="hint">Click / drag to pulse</div>
		<script>
			const canvas = document.getElementById('c');
			const ctx = canvas.getContext('2d');
			let w = 0;
			let h = 0;
			let t = 0;
			const pulses = [];

			function resize() {
				w = canvas.width = window.innerWidth * devicePixelRatio;
				h = canvas.height = window.innerHeight * devicePixelRatio;
				ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
			}

			function addPulse(x, y) {
				pulses.push({ x, y, r: 8, life: 1 });
			}

			window.addEventListener('resize', resize);
			window.addEventListener('pointerdown', (e) => addPulse(e.clientX, e.clientY));
			window.addEventListener('pointermove', (e) => {
				if (e.buttons) addPulse(e.clientX, e.clientY);
			});

			function frame() {
				t += 0.016;
				ctx.fillStyle = '#1a5cff';
				ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

				ctx.fillStyle = '#ff3b1f';
				ctx.font = `900 ${Math.min(window.innerWidth, window.innerHeight) * 0.22}px Arial Black, Helvetica, sans-serif`;
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.globalAlpha = 0.95;
				ctx.fillText('JUST DO IT', window.innerWidth / 2, window.innerHeight * 0.42 + Math.sin(t * 2) * 6);
				ctx.globalAlpha = 1;

				for (let i = pulses.length - 1; i >= 0; i--) {
					const p = pulses[i];
					p.r += 4;
					p.life -= 0.02;
					ctx.beginPath();
					ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
					ctx.strokeStyle = `rgba(255,255,255,${Math.max(p.life, 0)})`;
					ctx.lineWidth = 3;
					ctx.stroke();
					if (p.life <= 0) pulses.splice(i, 1);
				}

				requestAnimationFrame(frame);
			}

			resize();
			addPulse(window.innerWidth * 0.5, window.innerHeight * 0.55);
			frame();
		</script>
	</body>
</html>
