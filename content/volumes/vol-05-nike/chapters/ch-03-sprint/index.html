<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sprint</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #111;
				color: #f5f5f5;
				font-family: Helvetica, Arial, sans-serif;
				overflow: hidden;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			.hud {
				position: fixed;
				left: 1rem;
				bottom: 1rem;
				font-size: 0.85rem;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				opacity: 0.75;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<div class="hud" id="hud">Hold space / tap to sprint</div>
		<script>
			const canvas = document.getElementById('c');
			const ctx = canvas.getContext('2d');
			const hud = document.getElementById('hud');
			let sprinting = false;
			let x = 0;
			let speed = 0;

			function resize() {
				canvas.width = window.innerWidth * devicePixelRatio;
				canvas.height = window.innerHeight * devicePixelRatio;
				ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
			}

			function setSprint(on) {
				sprinting = on;
				hud.textContent = on ? 'Sprinting' : 'Hold space / tap to sprint';
			}

			window.addEventListener('resize', resize);
			window.addEventListener('keydown', (e) => {
				if (e.code === 'Space') {
					e.preventDefault();
					setSprint(true);
				}
			});
			window.addEventListener('keyup', (e) => {
				if (e.code === 'Space') setSprint(false);
			});
			window.addEventListener('pointerdown', () => setSprint(true));
			window.addEventListener('pointerup', () => setSprint(false));

			function frame() {
				const w = window.innerWidth;
				const h = window.innerHeight;
				speed += ((sprinting ? 14 : 3) - speed) * 0.08;
				x = (x + speed) % 80;

				ctx.fillStyle = '#111';
				ctx.fillRect(0, 0, w, h);

				ctx.strokeStyle = '#f5f5f5';
				ctx.lineWidth = 4;
				ctx.beginPath();
				ctx.moveTo(0, h * 0.72);
				ctx.lineTo(w, h * 0.72);
				ctx.stroke();

				for (let i = -1; i < w / 80 + 2; i++) {
					const sx = i * 80 - x;
					ctx.fillStyle = i % 2 === 0 ? '#ff3b1f' : '#f5f5f5';
					ctx.fillRect(sx, h * 0.72 + 10, 40, 8);
				}

				const bob = Math.sin(performance.now() / (sprinting ? 70 : 160)) * (sprinting ? 16 : 6);
				ctx.fillStyle = '#ff3b1f';
				ctx.beginPath();
				ctx.arc(w * 0.35, h * 0.72 - 48 + bob, 28, 0, Math.PI * 2);
				ctx.fill();
				ctx.fillStyle = '#f5f5f5';
				ctx.fillRect(w * 0.35 - 8, h * 0.72 - 90 + bob, 16, 50);

				requestAnimationFrame(frame);
			}

			resize();
			frame();
		</script>
	</body>
</html>
