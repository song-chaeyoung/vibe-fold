<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>밑 빠진 독에 물 붓기</title>
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #2a2a28;
				touch-action: none;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			.caption {
				position: fixed;
				left: 50%;
				top: 42%;
				transform: translate(-50%, -50%);
				margin: 0;
				color: rgba(20, 36, 48, 0.72);
				font: 500 22px/1.4 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
				letter-spacing: 0.12em;
				opacity: 0;
				transition: opacity 1.2s ease;
				pointer-events: none;
				white-space: nowrap;
			}
			.caption.is-on {
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<p class="caption" id="caption">밑 빠진 독에 물 붓기</p>
		<script>
			const canvas = document.getElementById("c");
			const ctx = canvas.getContext("2d");
			const caption = document.getElementById("caption");
			const TAU = Math.PI * 2;

			let w = 0;
			let h = 0;
			let dpr = 1;
			let time = 0;
			let last = performance.now();

			const pointer = { x: 0, y: 0 };
			let holding = false;
			let water = 0.08;
			let pool = 0;
			let flooded = false;
			const drops = [];
			const drips = [];

			function resize() {
				dpr = Math.min(window.devicePixelRatio || 1, 2);
				w = window.innerWidth;
				h = window.innerHeight;
				canvas.width = Math.floor(w * dpr);
				canvas.height = Math.floor(h * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				if (!pointer.x) {
					pointer.x = w * 0.5;
					pointer.y = h * 0.22;
				}
			}

			function jarBox() {
				const jw = Math.min(w * 0.62, 420);
				const jh = Math.min(h * 0.58, 460);
				return {
					x: w * 0.5,
					y: h * 0.62,
					top: h * 0.62 - jh * 0.42,
					bottom: h * 0.62 + jh * 0.38,
					width: jw,
					height: jh,
					mouth: jw * 0.28,
				};
			}

			function jarPath(box) {
				const { x, top, bottom, width } = box;
				ctx.beginPath();
				ctx.moveTo(x - width * 0.28, top);
				ctx.bezierCurveTo(x - width * 0.36, top + 24, x - width * 0.48, top + 80, x - width * 0.46, (top + bottom) / 2);
				ctx.bezierCurveTo(x - width * 0.44, bottom - 40, x - width * 0.3, bottom, x, bottom);
				ctx.bezierCurveTo(x + width * 0.3, bottom, x + width * 0.44, bottom - 40, x + width * 0.46, (top + bottom) / 2);
				ctx.bezierCurveTo(x + width * 0.48, top + 80, x + width * 0.36, top + 24, x + width * 0.28, top);
				ctx.closePath();
			}

			function drawWorkshop() {
				const g = ctx.createLinearGradient(0, 0, 0, h);
				g.addColorStop(0, "#1c1c1a");
				g.addColorStop(0.35, "#2c2c2a");
				g.addColorStop(1, "#3a3834");
				ctx.fillStyle = g;
				ctx.fillRect(0, 0, w, h);
				ctx.fillStyle = "#4a4640";
				ctx.fillRect(0, h * 0.78, w, h * 0.22);
				ctx.fillStyle = "rgba(0,0,0,0.12)";
				for (let i = 0; i < 8; i += 1) {
					ctx.fillRect(i * (w / 8), h * 0.78, 1, h * 0.22);
				}
			}

			function drawJar(box) {
				ctx.save();
				jarPath(box);
				const clay = ctx.createLinearGradient(box.x - box.width * 0.5, box.top, box.x + box.width * 0.5, box.bottom);
				clay.addColorStop(0, "#8a5a38");
				clay.addColorStop(0.45, "#6b4030");
				clay.addColorStop(1, "#4a2c20");
				ctx.fillStyle = clay;
				ctx.fill();

				ctx.save();
				jarPath(box);
				ctx.clip();
				const innerTop = box.top + 10;
				const innerBottom = box.bottom - 8;
				const fillY = innerBottom - (innerBottom - innerTop) * water;
				const wave = Math.sin(time * 3.2) * 3;
				ctx.fillStyle = "#7fb7c9";
				ctx.beginPath();
				ctx.rect(box.x - box.width, fillY + wave, box.width * 2, innerBottom - fillY + 20);
				ctx.fill();
				ctx.fillStyle = "rgba(210, 236, 242, 0.35)";
				ctx.fillRect(box.x - box.width, fillY + wave, box.width * 2, 6);
				ctx.restore();

				ctx.strokeStyle = "rgba(255, 230, 200, 0.18)";
				ctx.lineWidth = 10;
				ctx.beginPath();
				ctx.moveTo(box.x - box.width * 0.22, box.top + 30);
				ctx.quadraticCurveTo(box.x - box.width * 0.3, box.y, box.x - box.width * 0.18, box.bottom - 50);
				ctx.stroke();

				ctx.strokeStyle = "rgba(20, 10, 8, 0.7)";
				ctx.lineWidth = 2;
				ctx.beginPath();
				ctx.moveTo(box.x - 8, box.bottom - 6);
				ctx.lineTo(box.x + 14, box.bottom + 10);
				ctx.moveTo(box.x + 2, box.bottom - 2);
				ctx.lineTo(box.x + 8, box.bottom + 16);
				ctx.stroke();

				ctx.fillStyle = "#5a3a28";
				ctx.beginPath();
				ctx.ellipse(box.x, box.top + 4, box.mouth, 8, 0, 0, TAU);
				ctx.fill();
				ctx.fillStyle = "#2a1810";
				ctx.beginPath();
				ctx.ellipse(box.x, box.top + 4, box.mouth * 0.72, 5, 0, 0, TAU);
				ctx.fill();
				ctx.restore();
			}

			function drawPool() {
				if (pool <= 0.002) return;
				const y = h - pool * h * 0.92;
				const g = ctx.createLinearGradient(0, y, 0, h);
				g.addColorStop(0, "rgba(150, 196, 210, 0.55)");
				g.addColorStop(1, "rgba(70, 110, 128, 0.92)");
				ctx.fillStyle = g;
				ctx.beginPath();
				ctx.moveTo(0, h);
				ctx.lineTo(0, y);
				for (let x = 0; x <= w; x += 16) {
					ctx.lineTo(x, y + Math.sin(x * 0.04 + time * 2.4) * 4);
				}
				ctx.lineTo(w, h);
				ctx.closePath();
				ctx.fill();
			}

			function spawnPour(box) {
				const rate = holding ? Math.max(0.2, 1.15 - Math.abs(pointer.y - box.top) / h) : 0;
				if (rate <= 0) return 0;
				for (let i = 0; i < 3; i += 1) {
					drops.push({
						x: pointer.x + (Math.random() - 0.5) * 10,
						y: pointer.y + 8,
						vx: (box.x - pointer.x) * 0.8 + (Math.random() - 0.5) * 20,
						vy: 80 + Math.random() * 40,
						r: 1.6 + Math.random() * 1.6,
						life: 1,
					});
				}
				return rate;
			}

			function spawnDrip(box) {
				drips.push({
					x: box.x + 6 + (Math.random() - 0.5) * 8,
					y: box.bottom + 8,
					vy: 30 + Math.random() * 40,
					r: 1.4 + Math.random() * 1.2,
					life: 1,
				});
			}

			function resetFlood() {
				water = 0.08;
				pool = 0;
				flooded = false;
				drops.length = 0;
				drips.length = 0;
				caption.classList.remove("is-on");
			}

			function step(dt) {
				time += dt;
				const box = jarBox();
				const pour = spawnPour(box);
				const leak = 0.07 + water * 0.16 + (water > 0.78 ? 0.22 : 0);
				water += pour * 0.22 * dt;
				water -= leak * dt;
				water = Math.max(0.02, Math.min(0.92, water));
				pool += leak * 0.18 * dt;
				if (pour > 0) pool += 0.01 * dt;
				pool = Math.min(1, pool);

				if (Math.random() < leak * 8 * dt) spawnDrip(box);

				for (let i = drops.length - 1; i >= 0; i -= 1) {
					const drop = drops[i];
					drop.x += drop.vx * dt;
					drop.y += drop.vy * dt;
					drop.vy += 420 * dt;
					drop.life -= dt * 0.9;
					if (drop.y > box.top + 8 || drop.life <= 0) drops.splice(i, 1);
				}
				for (let i = drips.length - 1; i >= 0; i -= 1) {
					const drip = drips[i];
					drip.y += drip.vy * dt;
					drip.vy += 380 * dt;
					drip.life -= dt * 0.7;
					if (drip.y > h || drip.life <= 0) drips.splice(i, 1);
				}

				if (pool > 0.86 && !flooded) {
					flooded = true;
					caption.classList.add("is-on");
				}
			}

			function drawDrops() {
				ctx.fillStyle = "rgba(180, 220, 230, 0.75)";
				for (const drop of drops) {
					ctx.beginPath();
					ctx.ellipse(drop.x, drop.y, drop.r * 0.6, drop.r * 1.3, 0, 0, TAU);
					ctx.fill();
				}
				for (const drip of drips) {
					ctx.beginPath();
					ctx.ellipse(drip.x, drip.y, drip.r * 0.55, drip.r * 1.4, 0, 0, TAU);
					ctx.fill();
				}
			}

			function frame(now) {
				const dt = Math.min(0.033, (now - last) / 1000);
				last = now;
				step(dt);
				drawWorkshop();
				drawJar(jarBox());
				drawDrops();
				drawPool();
				requestAnimationFrame(frame);
			}

			function setPointer(event) {
				const rect = canvas.getBoundingClientRect();
				pointer.x = event.clientX - rect.left;
				pointer.y = event.clientY - rect.top;
			}

			canvas.addEventListener("pointerdown", (event) => {
				setPointer(event);
				if (flooded) {
					resetFlood();
					return;
				}
				holding = true;
				canvas.setPointerCapture(event.pointerId);
			});
			canvas.addEventListener("pointermove", setPointer);
			canvas.addEventListener("pointerup", () => {
				holding = false;
			});
			window.addEventListener("keydown", (event) => {
				if (event.code === "Space") {
					event.preventDefault();
					if (flooded) resetFlood();
					else holding = true;
				}
			});
			window.addEventListener("keyup", (event) => {
				if (event.code === "Space") holding = false;
			});
			window.addEventListener("resize", resize);

			resize();
			requestAnimationFrame(frame);
		</script>
	</body>
</html>
